<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Releasea - Service surface</title>
    <meta name="description" content="Releasea is the service surface: the workload and the edge a request passes through." />
    <meta name="author" content="Releasea" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />

    <meta property="og:title" content="Releasea - Service surface" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@releasea" />
    <meta name="twitter:image" content="/releasea.svg" />
    <script>
      try {
        var stored = JSON.parse(localStorage.getItem('releasea.preferences') || '{}');
        var theme = stored.theme || 'dark';
        var dark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
